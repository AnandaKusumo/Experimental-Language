[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "venturis"
version = "0.1.0"
description = "The Venturis programming language"
requires-python = ">=3.11"

[project.scripts]
venturis = "cli:main"

[tool.setuptools]
py-modules = ["cli", "interpreter", "lexer", "main", "parser"]